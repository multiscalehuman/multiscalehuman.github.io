# Thin caller: CI runs AtlasNG's reusable workflow nx-ci.yml. Triggers, permissions, and concurrency live here.
# The reusable workflow resolves `./.github/actions/*` against this repository, so setup-nx-workspace and
# deploy-preview must exist here.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    uses: cns-iu/AtlasNG/.github/workflows/nx-ci.yml@e43a35d27b6aa2fac7511da4517bd3319350d7f2
    with:
      deploy-preview: true
      netlify-filter: ''
    secrets:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
